name: Release

# A release: the installer, its checksum (for clients older than 0.6.3) and a
# signed update.json, which the tray's updater picks up (src/tray/updater.h). Either push a tag
#   git tag v0.2.0 && git push origin v0.2.0
# or run this workflow by hand with the version: it tags the commit it runs on.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, MAJOR.MINOR.PATCH (the tag v<version> is created on the chosen branch)'
        required: true

# Two jobs, so that the key that signs updates never shares a machine with the build - the build runs
# other people's code (the toolchain actions, vcpkg ports, Go modules, sing-box); the job holding
# the key runs only this repository's scripts, GitHub's own actions, and what the build handed over.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Locate MinGW-w64 gcc (needed for gocore's cgo build; MSVC can't compile cgo's C side)
        shell: pwsh
        run: |
          # windows-latest ships a MinGW-w64 toolchain at C:\mingw64 already
          # (visible via __VSCMD_PREINIT_PATH) — no need to install one via
          # egor-tensin/setup-mingw, which as of this writing fails outright
          # (it tries to delete libpthread.dll.a to force static linking,
          # a file that doesn't exist in the current chocolatey mingw
          # package layout).
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            $gcc = Get-ChildItem "C:\mingw64\bin\gcc.exe" -ErrorAction SilentlyContinue
            if ($gcc) { Add-Content -Path $env:GITHUB_PATH -Value "C:\mingw64\bin" }
          }
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue) -and -not $gcc) {
            throw "no gcc found on PATH or at C:\mingw64\bin"
          }

      - name: Bootstrap vcpkg (the pinned commit)
        shell: pwsh
        run: pwsh tools/ci/bootstrap-vcpkg.ps1

      - name: Fetch pinned sing-box (gocore depends on it via go.mod replace)
        shell: pwsh
        run: pwsh tools/ci/fetch-singbox.ps1

      - name: Fetch pinned wintun.dll (sing-tun loads it at runtime; see tools/codegen/wintun.version)
        shell: pwsh
        run: |
          $version = (Get-Content tools/codegen/wintun.version)[0]
          $expectedHash = (Get-Content tools/codegen/wintun.version)[1]
          $zipPath = "$env:RUNNER_TEMP\wintun-$version.zip"
          # Retries + an explicit check: one silent failed download (25.09.2026) surfaced
          # only as "cannot find path" from Get-FileHash below.
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o $zipPath "https://www.wintun.net/builds/wintun-$version.zip"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zipPath)) { throw "wintun-$version.zip download failed (curl exit $LASTEXITCODE)" }
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "wintun-$version.zip sha256 mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\wintun-extracted" -Force
          New-Item -ItemType Directory -Force -Path vendor/wintun/amd64 | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun-extracted\wintun\bin\amd64\wintun.dll" vendor/wintun/amd64/wintun.dll

      # The conformance reference (tests/conformance): the official release of the pinned
      # version, exactly the binary the golden ClientHellos were recorded from. A sing-box
      # bump fails here until the pin and the golden files are renewed on purpose.
      - name: Version
        shell: pwsh
        env:
          # Through the environment, not pasted into the script: the input is free text.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "not a MAJOR.MINOR.PATCH version: '$version'" }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"

      - name: Build the installer
        shell: pwsh
        run: pwsh installer/build.ps1 -Version $env:VERSION -OutDir out

      # The same check the CI's installer job runs: a release never ships an
      # installer that didn't install, update and uninstall cleanly.
      - name: Install, update, uninstall
        shell: pwsh
        run: pwsh installer/smoke.ps1 -Installer "out/Sovereign-Setup-$env:VERSION.exe"

      # What the build made, to the job that signs and publishes it.
      - name: Hand the installer over
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: out
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Version
        shell: pwsh
        env:
          # Through the environment, not pasted into the script: the input is free text.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "not a MAJOR.MINOR.PATCH version: '$version'" }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: out
      # update.json names this release and where the next one is. The secret is the primary key
      # (src/tray/update.h, kUpdateKeys); a key the client doesn't carry fails the script, so a
      # release is never published unsigned.
      - name: Sign the release description
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: pwsh tools/release/sign-update.ps1 -Version $env:VERSION -Installer "out/Sovereign-Setup-$env:VERSION.exe" -Out out/update.json

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notice first, then the version's section of CHANGELOG.md ("## 0.6.0 ..." up to the
          # next "## "), if it has one, then what GitHub generates from the changes since the last
          # release. Not marked a pre-release on purpose: the client's updater asks for
          # releases/latest, which skips them.
          $notes = "> **Experimental build.** Sovereign is under active development and not finished. It is not recommended for anyone else to download yet: expect rough edges and changes without notice."
          $changelog = if (Test-Path CHANGELOG.md) { Get-Content CHANGELOG.md -Raw -Encoding utf8 } else { '' }
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))(?=\s)[^\n]*\n(.*?)(?=^## |\z)")
          if ($section.Success -and $section.Groups[1].Value.Trim()) {
            $notes += "`n`n" + $section.Groups[1].Value.Trim()
          } else {
            Write-Host "CHANGELOG.md has no section for ${env:VERSION}, the generated notes only"
          }
          Set-Content -Path "$env:RUNNER_TEMP/notes.md" -Value $notes -Encoding utf8
          gh release create "v$env:VERSION" out/* --title "Sovereign $env:VERSION" --notes-file "$env:RUNNER_TEMP/notes.md" --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
